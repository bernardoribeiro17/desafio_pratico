<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Contato</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./theme-fallback.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="bg-dark p-3">
      <ul class="nav">
        <li class="nav-item">
          <a class="nav-link text-white" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="produtos.html">Produtos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="contato.html">Contato</a>
        </li>
        <li class="nav-item d-flex align-items-center">
          <button
            id="theme-light-button"
            type="button"
            class="btn btn-sm btn-theme-light ms-3"
          >
            Claro
          </button>
          <button
            id="theme-dark-button"
            type="button"
            class="btn btn-sm btn-theme-dark ms-2"
          >
            Escuro
          </button>
          <button
            id="theme-switcher"
            type="button"
            class="btn btn-sm btn-theme-toggle ms-2"
          >
            🎨 Tema: Azul/Laranja
          </button>
        </li>
      </ul>
    </nav>

    <!-- Container com formulário -->
    <div class="container mt-5">
      <h2>Fale Conosco</h2>

      <form>
        <!-- Nome -->
        <div class="mb-3">
          <label for="nome" class="form-label">Nome</label>
          <input
            type="text"
            class="form-control"
            id="nome"
            placeholder="Digite seu nome"
          />
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Digite seu e-mail"
          />
        </div>

        <!-- Mensagem -->
        <div class="mb-3">
          <label for="mensagem" class="form-label">Mensagem</label>
          <textarea
            class="form-control"
            id="mensagem"
            rows="4"
            placeholder="Digite sua mensagem"
          ></textarea>
        </div>

        <!-- Botão -->
        <button type="submit" class="btn btn-success">Enviar</button>
      </form>
    </div>

    <script type="module" src="./src/main.js"></script>
    <script src="./theme-fallback.js"></script>
  </body>
</html>
